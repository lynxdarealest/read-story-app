name: Build and publish VBook release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set package version from release tag
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".Substring(1)
          $currentVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($currentVersion -ne $version) {
            npm version $version --no-git-tag-version
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Create draft release
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo "${{ github.repository }}" --draft --title "VBook Desktop $tag" --notes "Windows installer for VBook Desktop $tag."
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Windows installer
        run: npm run release:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish completed release
        shell: pwsh
        run: |
          gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
